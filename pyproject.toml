# 这个文件只放工具配置，项目本身零依赖，用系统自带的 Python 3 就能跑。

[project]
name = "finai"
version = "0.1.0"
description = "自动化估值建模：从财务假设跑到带推理与图表的估值报告"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"   # 用到 tomllib，它是 3.11 才进标准库的

# 核心链路只用标准库 —— 这里刻意为空，装了也不会拉任何包。
# 可选增强见下面的 optional-dependencies，缺了会降级而不是报错。
dependencies = []

[project.optional-dependencies]
charts  = ["matplotlib>=3.8"]      # 六张分析图
pdf     = ["reportlab>=4.0"]       # PDF 后备渲染（首选是 LaTeX）
extract = ["pdfplumber>=0.11"]     # 年报 PDF 抽取
all     = ["matplotlib>=3.8", "reportlab>=4.0", "pdfplumber>=0.11"]

[project.scripts]
finai = "pipeline.cli:main"        # 装完就有 finai 命令，见 docs/reproduce.md

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["algorithm", "algorithm.finai", "algorithm.output", "pipeline", "mcp_server", "finai_web"]

[tool.mypy]
# 第三方库（例如要装了才有的 matplotlib）找不到类型存根时不报错
ignore_missing_imports = true
# 跑法：在仓库根目录执行 python3 -m mypy algorithm pipeline
# algorithm/ 下有 __init__.py，所以包名能正确解析成 algorithm.finai.xxx

[tool.pyright]
# 跑法：npx pyright algorithm
# VSCode 的 Pylance 用的就是这套引擎，跑这个等于提前看到编辑器里的全部警告
#
# include 必须把两部分都列上，否则 `npx pyright`（不带参数）只查 algorithm、
# 悄悄漏掉 pipeline —— 漏掉的那部分会在 VSCode 里报一片红，命令行却显示干净。
include = ["algorithm", "pipeline", "mcp_server", "finai_web"]
exclude = ["**/__pycache__"]
# 直接按最严格的模式要求，当前代码在严格模式下也是干净的
typeCheckingMode = "strict"
# 图表层需要 matplotlib；没装的话那些文件会报「无法解析导入」，
# 装一下即可：python3 -m pip install matplotlib
#
# 下面四条是 matplotlib 类型存根的局限，不是代码问题：
# 它的参数签名里大量是 **kwargs: Unknown，严格模式会对每一处绘图调用报警。
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportMissingTypeStubs = "none"
