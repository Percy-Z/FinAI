# ============================================================================
# FinAI 经营假设与基期数据
#
# 这个文件是「人填」的：组员改这里的数字，代码负责读它。
# 字段名与 algorithm/finai/forecast.py 里的 ForecastDrivers / BalanceSheetState
# 完全一致，所以读取代码可以一行就把字典变成对象，不需要逐字段抄写。
#
# 单位约定（全项目统一，中途不要换）：
#     金额   元
#     股数   股
#     比率   小数，0.12 表示 12%
#
# ---------------------------------------------------------------------------
# ⚠️ 这个文件里装着两类性质完全不同的数据，别混为一谈：
#
#   [company]          元数据，无所谓事实或假设
#   [drivers]          经营假设 —— 我们的判断，带主观性
#                      （增速定多少、毛利率能不能维持，都是我们说了算）
#   [opening_balance]  历史事实 —— 年报上白纸黑字写着的数字，不是我们假设的
#                      它的正确来源是「从年报抽取」，不是「人手填」
#
# 为什么现在放在一起：抽取层还没建，先用这份手填的基期数据把流水线跑通。
# 这是刻意的过渡方案，不是最终形态。
#
# 将来要拆开：
#   [drivers]         继续留在这里，由人填写
#   [opening_balance] 改由抽取层从年报生成（financials.json），
#                     每个数字带上「年报第几页、原文怎么写的」
#
# 所以 config.py 里请把两者分成两个独立的读取函数，
# 将来只换 opening_balance 的来源，另一个模块不用动。
# ---------------------------------------------------------------------------
#
# 注意：这里不放股价、股数、WACC 参数。那些属于市场数据，
#       以后放在 data/market.csv 和 data/wacc.toml 里，避免同一个数字
#       在两处各写一遍、将来改了一处忘了另一处。
# ============================================================================


# ---------------------------------------------------------------------------
# 一、基本标识
# ---------------------------------------------------------------------------

[company]
name = "长春高新技术产业（集团）股份有限公司"   # 公司名称，会写进报告
code = "000661"                                 # 证券代码，用于和可比公司列表对应
source = "cninfo/2025年年度报告"                # 数据来源标记，会写进产物和日志


# ---------------------------------------------------------------------------
# 二、三表预测的驱动假设（对应 ForecastDrivers）
#
# 预测期由 years 决定。下面几个数组字段的长度必须等于 years，
# 写成单个数字时，代码会自动把它广播到每一年。
# ---------------------------------------------------------------------------

[drivers]
revenue_base        = 12083140489.05           # 基期营业收入 = 2025 年合并营业总收入（年报第 87 页）
base_year           = 2025                     # 基期年份，预测期从下一年开始
years               = 5                        # 显式预测期年数

# 收入增速，逐年给出。5 个数对应 2026~2030 年
# 依据：2025 年实际 −10.27%（120.83 亿 vs 上年 134.66 亿），其中核心子公司金赛药业
# 收入 98.19 亿、同比 −7.98%（年报第 22 页）。增长假设取「低速恢复」：新品放量 + 基数
# 效应，且逐年回落 —— 见 [evidence] 里这一条的完整说明。⚠️ 这是假设，不是年报数据。
revenue_growth      = [0.03, 0.05, 0.05, 0.04, 0.03]

# 利润率相关，均为「占当年收入的比例」
# 毛利率 83%：由年报第 88 页反推 —— 营业总成本 113.26 亿 − 销售 50.91 亿 − 管理 14.99 亿
# − 研发 24.72 亿 − 财务(−0.04 亿) − 税金及附加 1.07 亿 ≈ 营业成本 20.6 亿
gross_margin        = 0.83
# 期间费用率 75%：销售 + 管理 + 研发 + 财务 = 90.58 亿，占收入 74.97%
opex_pct_revenue    = 0.75
# 折旧摊销 6.33%：年报第 159 页现金流量表补充资料 —— 固定资产折旧 4.55 亿 +
# 无形资产摊销 2.58 亿 + 长期待摊费用摊销 0.52 亿 = 7.65 亿
da_pct_revenue      = 0.0633
# 资本开支：⚠️ 本模型最大的假设。2025 年实际为 22.03 亿（占收入 18.2%，扩产高峰），
# 这里按「维持性资本开支 ≈ 折旧摊销」处理，否则预测期自由现金流为负、DCF 失去意义。
# 报告第 9 节必须说明这一点，并在敏感性里给出资本开支上行的情形。
capex_pct_revenue   = 0.0633

# 营运资本相关，均为「占当年收入的比例」
# 三者的口径必须与基期资产负债表对齐（否则两条路径第一年就对不上，测试会拦）：
#   应收账款 20.31 亿 / 120.83 亿 = 16.81%
#   存货     58.33 亿 / 120.83 亿 = 48.28%（生物制品备货重）
#   应付账款  7.12 亿 / 120.83 亿 =  5.89%
ar_pct_revenue          = 0.1680739523
inventory_pct_revenue   = 0.4827775795
ap_pct_revenue          = 0.0588987674

# 融资与税务
# 利息费用 0.43 亿 / 有息负债 18.55 亿 = 2.33%（年报第 155 页利息支出）
interest_rate_on_debt   = 0.0233
tax_rate                = 0.25                 # 法定税率 25%；2025 年因利润总额近乎为零，实际税率不具参考性
# 现金分红 0.64 亿 / 归母净利润 1.55 亿 = 41.5%（年报第 58 页：每 10 股派 1.60 元）
dividend_payout_ratio   = 0.415

# 可选字段（用不到就保持默认值，不要删掉注释说明）
net_debt_repayment      = 0.0                  # 每年净还款额，元；0 表示不还
minority_share_of_profit = 0.0                 # 少数股东损益占净利润的比例


# ---------------------------------------------------------------------------
# 二之二、估值参数（WACC 的输入）
#
# 这四个是「输入型参数」—— 需要人为判断，而且每个都必须能回答
# 「这个数是从哪来的、是什么时候的」。报告里的 WACC 那一节直接引用这里。
#
# 刻意不放的两个字段：
#   equity_weight / debt_weight   它们是「推导型参数」，由市值和债务算出来，
#                                 人填了就等于给了两个可能互相矛盾的来源
#   tax_rate                      它只在上面 [drivers] 里写一次。WACC 和预测
#                                 必须用同一个税率，否则报表内部不自洽
# 这三项在算 WACC 时会自动补齐，报告里要列出来，但不需要在这里填。
#
# 注释格式约定：来源说明 | 基准日或版本 | 状态
#   ⚠️ 待查      还没去查
#   ⚠️ 待替换    现在用的是示例值，需要换成查证过的
#   ✅ 已确认    已查证，可写进报告
#
# 注意：下面四个值目前都取自示例代码，是为了让流水线先跑通而填的
# 占位值，不是查来的。四个都还没落实来源。
# ---------------------------------------------------------------------------

[wacc]
# 基准日 2026-09-30 的公开市场数据，逐条出处见下面 [evidence] 台账（含查询日期）
risk_free            = 0.0168    # 中国 10 年期国债到期收益率 1.683%（基准日 2026-09-30）
beta                 = 1.00      # 无个股数据时取市场平均（=1）；真实标的后换成对沪深300 的回归值
equity_risk_premium  = 0.0514    # 中国总股权风险溢价 5.14%（Damodaran 国家风险溢价表）
cost_of_debt         = 0.035     # 市场基准：5 年期以上 LPR 3.50%；真实标的改用「利息支出 / 平均有息负债」


# ---------------------------------------------------------------------------
# 二之三、终值假设
#
# 显式预测期结束之后，公司还值多少（终值）。两种算法选一种：
#   perpetuity      永续增长法：终值 = 末年 FCFF × (1 + g) / (WACC − g)
#   exit_multiple   退出倍数法：终值 = 末年 EBITDA × 退出倍数
#
# 约束：永续增长率必须低于 WACC（代码强制），并且应当低于长期名义 GDP 增速。
# 注意低利率环境：基准日 10 年期国债收益率只有 1.68%，而长期名义 GDP 增速明显更高，
# 这时「g 必须低于无风险利率」这条老规矩会把增长预期压到不合理的低水平，
# 所以本项目采用「低于长期名义 GDP、且明显保守」的口径，并在报告里说明这一点。
#
# 字段名与估值模块的 ForecastAssumptions 一致，方便直接对应。
# ---------------------------------------------------------------------------

[terminal]
terminal_method = "perpetuity"   # perpetuity 或 exit_multiple
terminal_growth = 0.025          # 永续增长率，method = perpetuity 时使用
# exit_multiple = 8.0            # 退出倍数，method = exit_multiple 时打开

# 折现是否用「中值惯例」：假设现金流在年中发生，折现期数减 0.5。
# false 是更保守的算法；true 更贴近现实。两种都是通行做法，报告里要说明选了哪种。
mid_year        = false


# ---------------------------------------------------------------------------
# 二之四、敏感性分析的浮动幅度
#
# 这里只填「上下浮动多少」，不填基准值 —— 基准值就是上面 [drivers]、
# [wacc]、[terminal] 里已经填好的那些数，不在这里重复一遍。
# 同一个数字写两遍，迟早会有一处忘了改。
#
# 为什么浮动幅度也算「假设」、也要写在配置里：
#   龙卷风图的排序不只取决于模型，也取决于你给每个参数定了多宽的上下界。
#   把 A 的幅度放宽一倍，A 就会爬到榜首。所以幅度本身是一个判断，
#   报告里要能解释「为什么永续增长率取 ±1 个百分点而不是 ±0.5」。
#
# 参照（写报告时按这个口径解释）：
#   terminal_growth_delta  ±1pp  ≈ 长期 GDP 增速上浮或下修一个档
#   wacc_delta             ±1pp  ≈ beta 或风险溢价有 ±15% 的偏差
#   revenue_growth_delta   ±3pp  ≈ 增速预测的合理分歧区间
#   ebit_margin_delta      ±3pp  ≈ 毛利率或费用率各让一步
#   tax_rate_delta         ±5pp  ≈ 优惠税率到期 / 高新资格变化
# ---------------------------------------------------------------------------

[sensitivity]
wacc_delta            = 0.01    # WACC 上下各浮动 1 个百分点
terminal_growth_delta = 0.01    # 永续增长率上下各浮动 1 个百分点
revenue_growth_delta  = 0.03    # 收入增速上下各浮动 3 个百分点
ebit_margin_delta     = 0.03    # EBIT 利润率上下各浮动 3 个百分点
tax_rate_delta        = 0.05    # 税率上下各浮动 5 个百分点
grid_points           = 5       # 双因素网格每轴取几个点


# ---------------------------------------------------------------------------
# 二之五、报告叙述生成的参数
#
# 报告里的数字全部由代码算好（事实表），大模型只负责把这些数字讲成人话。
# 它写完之后，程序会把正文里出现的每一个数字回头与事实表比对，
# 对不上的挑出来列在报告附录里。
#
# ⚠️ API key 不写在这里，写在环境变量里：
#       export DEEPSEEK_API_KEY=sk-xxxxx
#    没有这个环境变量时报告照常生成 —— 表格、图、数字都在，
#    只是叙述段落换成一句「未调用大模型」的说明。流水线不会失败。
#
# 模型怎么选：
#   deepseek-v4-pro    写作质量更好，适合出最终报告
#   deepseek-flash     更快更便宜，适合反复调试时用
#
# temperature 给 0.3：报告是说明文体，不需要发挥，但也不该死板到
# 每次都同一句话。调高会更容易出现自由发挥的措辞。
# ---------------------------------------------------------------------------

[report]
enabled      = true
model        = "deepseek-v4-pro"
base_url     = "https://api.deepseek.com"
api_key_env  = "DEEPSEEK_API_KEY"
api_key_file = "apikey.txt"    # 环境变量找不到时读这个文件；⚠️ 已在 .gitignore 里忽略
temperature  = 0.3
max_tokens   = 32000
timeout_s    = 120.0
effort       = "high"    # 推理强度：low 快而省（调试用）/ high（出报告用）/ max


# ---------------------------------------------------------------------------
# 二之六、假设依据台账
#
# 通知把「假设依据」列为选题 4 的考察点。上面 [drivers] [wacc] [terminal]
# 里每一个数字都是我们填的，这个台账回答的是「凭什么填这个数」。
#
# 写法：键是参数名（写清楚归属，例如 wacc.beta），值是依据与状态。
# 状态用三个词之一，方便自己和评委一眼看出落实程度：
#     ✅ 已确认   查证过，可以写进报告
#     ⚠️ 待查     还没去找来源
#     ⚠️ 待替换   现在用的是示例值，需要换成查证过的
#
# 这份台账会原样出现在报告第 4.1 节（不经大模型加工），
# 大模型在第 4.2 节对这些依据做审查 —— 哪些站得住、哪些不站得住。
# ---------------------------------------------------------------------------

[evidence]
"drivers.revenue_growth" = "2026~2030 年收入增速 3%/5%/5%/4%/3%，是**假设**；依据 2025 年实际营业总收入 120.83 亿元、同比 −10.27%（年报第 87 页），核心子公司金赛药业 2025 年收入 98.19 亿元、同比 −7.98%（年报第 22 页），按「低速恢复、逐年回落」处理 → ✅ 已确认（假设已在报告第 9 节标注）"
"drivers.gross_margin"   = "毛利率 83%、期间费用率 75%；由 2025 年合并利润表反推（年报第 88 页，单位亿元：营业总成本 113.26、销售费用 50.91、管理费用 14.99、研发费用 24.72、财务费用 −0.036、税金及附加 1.07）→ ✅ 已确认"
"drivers.capex_pct_revenue" = "维持性资本开支 6.33%（= 折旧摊销占收入比）；2025 年实际资本开支 22.03 亿元、占收入 18.2%（年报第 93 页，扩产高峰），按实际值建模会使预测期自由现金流为负、DCF 失去意义，故取维持性口径 → ⚠️ 这是本模型最大的假设，报告第 9 节与敏感性分析必须体现"
"drivers.working_capital" = "营运资本比例：应收账款 16.81%、存货 48.28%、应付账款 5.89%（均为 2025 年期末余额 ÷ 营业总收入，年报第 81–83 页）→ ✅ 已确认"
"drivers.tax_rate"       = "法定税率 25%；依据《中华人民共和国企业所得税法》第四条。2025 年利润总额仅 46.29 万元（年报第 157 页），有效税率不具参考性，故按法定税率建模 → ✅ 已确认"
"wacc.risk_free"         = "10 年期国债到期收益率 1.683%；依据中债收益率曲线（10 年期 1.6864%）与英为财情历史数据（2026-09-30 收盘 1.683%），查询日期 2026-10-12 → ✅ 已确认"
"wacc.beta"              = "取 1.00（市场平均）；未取得该股对沪深300 的回归 β，先按中性值处理。提交版应替换为 60 个月月度收益率回归值（数据自 Wind / Choice）→ ⚠️ 待替换"
"wacc.equity_risk_premium" = "中国总股权风险溢价 5.14%；依据 A. Damodaran「Country Default Spreads and Risk Premiums」中国行 ERP（页面标注 Last updated: January 2026），查询日期 2026-10-12 → ✅ 已确认"
"wacc.cost_of_debt"      = "税前债务成本 2.33%；由 2025 年利息支出 0.43 亿元（年报第 155 页）÷ 期末有息负债 18.55 亿元算得 → ✅ 已确认"
"terminal.terminal_growth" = "永续增长率 2.5%，保守取值；低于 IMF 2026 年 7 月对中国的增速预测（2026 年 4.6%、2027 年 4.1%），并留出向长期名义 GDP 收敛的空间 → ✅ 已确认"
"market.price"           = "股价 71.83 元（2026-09-30 收盘）与总股本 4.079 亿股（2025 年报第 84 页）取自 data/market.csv；股价来源为东方财富行情接口，提交版须改为 Wind / Choice 导出并记录导出时间 → ⚠️ 待替换（数据源换成终端导出）"


# ---------------------------------------------------------------------------
# 三、基期资产负债表（对应 BalanceSheetState）
#
# 这是预测的起点。三个恒等式必须成立，否则 build_forecast 会直接报错：
#     资产总计 = 负债合计 + 权益合计
#     资产总计 = cash + accounts_receivable + inventory
#               + fixed_assets + other_non_current_assets
#     负债合计 = accounts_payable + interest_bearing_debt
#               + other_non_current_liabilities
#     权益合计 = share_capital + retained_earnings + minority_equity
#
# 本例验算：
#     资产 = 55 + 60 + 40 + 200 + 30 = 385
#     负债 = 40 + 100 + 25          = 165
#     权益 = 100 + 120              = 220
#     165 + 220 = 385  ✓
# ---------------------------------------------------------------------------

[opening_balance]
# 2025 年合并资产负债表期末数（单位：元）。这些值与 data/extracted/pipeline_input.json
# 里年报抽取出来的结果一致 —— 两条数据源给出同一套基期，切换时不会换口径。
# 出处：长春高新 2025 年年度报告，货币资金/应收/存货/固定资产在第 81–82 页，
#       应付账款第 83 页，负债与权益各项第 84 页。
cash                        = 2163960335.12    # 货币资金
accounts_receivable         = 2030861178.45    # 应收账款
inventory                   = 5833469318.15    # 存货
fixed_assets                = 7262297034.86    # 固定资产
other_non_current_assets    = 12789934809.96   # 其他非流动资产（倒挤）
accounts_payable            = 711682080.85     # 应付账款
interest_bearing_debt       = 1855029982.19    # 有息负债（短期 + 长期借款）
other_non_current_liabilities = 2644290134.80  # 其他非流动负债（倒挤）
share_capital               = 407937529.00     # 股本
retained_earnings           = 21600620590.50   # 留存收益（归母权益 − 股本，倒挤）
minority_equity             = 2860962359.20    # 少数股东权益
