# ============================================================================
# FinAI 经营假设与基期数据
#
# 这个文件是「人填」的：组员改这里的数字，代码负责读它。
# 字段名与 algorithm/finai/forecast.py 里的 ForecastDrivers / BalanceSheetState
# 完全一致，所以读取代码可以一行就把字典变成对象，不需要逐字段抄写。
#
# 单位约定（全项目统一，中途不要换）：
#     金额   元
#     股数   股
#     比率   小数，0.12 表示 12%
#
# ---------------------------------------------------------------------------
# ⚠️ 这个文件里装着两类性质完全不同的数据，别混为一谈：
#
#   [company]          元数据，无所谓事实或假设
#   [drivers]          经营假设 —— 我们的判断，带主观性
#                      （增速定多少、毛利率能不能维持，都是我们说了算）
#   [opening_balance]  历史事实 —— 年报上白纸黑字写着的数字，不是我们假设的
#                      它的正确来源是「从年报抽取」，不是「人手填」
#
# 为什么现在放在一起：抽取层还没建，先用这份手填的基期数据把流水线跑通。
# 这是刻意的过渡方案，不是最终形态。
#
# 将来要拆开：
#   [drivers]         继续留在这里，由人填写
#   [opening_balance] 改由抽取层从年报生成（financials.json），
#                     每个数字带上「年报第几页、原文怎么写的」
#
# 所以 config.py 里请把两者分成两个独立的读取函数，
# 将来只换 opening_balance 的来源，另一个模块不用动。
# ---------------------------------------------------------------------------
#
# 注意：这里不放股价、股数、WACC 参数。那些属于市场数据，
#       以后放在 data/market.csv 和 data/wacc.toml 里，避免同一个数字
#       在两处各写一遍、将来改了一处忘了另一处。
# ============================================================================


# ---------------------------------------------------------------------------
# 一、基本标识
# ---------------------------------------------------------------------------

[company]
name = "示例公司"          # 公司名称，会写进报告
code = "T"                 # 证券代码，用于和可比公司列表对应
source = "forecast_demo"   # 数据来源标记，会写进产物和日志


# ---------------------------------------------------------------------------
# 二、三表预测的驱动假设（对应 ForecastDrivers）
#
# 预测期由 years 决定。下面几个数组字段的长度必须等于 years，
# 写成单个数字时，代码会自动把它广播到每一年。
# ---------------------------------------------------------------------------

[drivers]
revenue_base        = 400.0                    # 基期（base_year）营业收入，元
base_year           = 2025                     # 基期年份，预测期从下一年开始
years               = 5                        # 显式预测期年数

# 收入增速，逐年给出。5 个数对应 2026~2030 年
revenue_growth      = [0.10, 0.09, 0.08, 0.07, 0.06]

# 利润率相关，均为「占当年收入的比例」
gross_margin        = 0.40                     # 毛利率：毛利 / 收入
opex_pct_revenue    = 0.15                     # 期间费用率
da_pct_revenue      = 0.05                     # 折旧摊销 / 收入
capex_pct_revenue   = 0.06                     # 资本开支 / 收入

# 营运资本相关，均为「占当年收入的比例」
ar_pct_revenue          = 0.15                 # 应收账款 / 收入
inventory_pct_revenue   = 0.10                 # 存货 / 收入
ap_pct_revenue          = 0.10                 # 应付账款 / 收入

# 融资与税务
interest_rate_on_debt   = 0.05                 # 有息负债利率，利息按期初债务计算
tax_rate                = 0.25                 # 所得税率（有效税率）
dividend_payout_ratio   = 0.30                 # 现金股利占归母净利润的比例

# 可选字段（用不到就保持默认值，不要删掉注释说明）
net_debt_repayment      = 0.0                  # 每年净还款额，元；0 表示不还
minority_share_of_profit = 0.0                 # 少数股东损益占净利润的比例


# ---------------------------------------------------------------------------
# 二之二、估值参数（WACC 的输入）
#
# 这四个是「输入型参数」—— 需要人为判断，而且每个都必须能回答
# 「这个数是从哪来的、是什么时候的」。报告里的 WACC 那一节直接引用这里。
#
# 刻意不放的两个字段：
#   equity_weight / debt_weight   它们是「推导型参数」，由市值和债务算出来，
#                                 人填了就等于给了两个可能互相矛盾的来源
#   tax_rate                      它只在上面 [drivers] 里写一次。WACC 和预测
#                                 必须用同一个税率，否则报表内部不自洽
# 这三项在算 WACC 时会自动补齐，报告里要列出来，但不需要在这里填。
#
# 注释格式约定：来源说明 | 基准日或版本 | 状态
#   ⚠️ 待查      还没去查
#   ⚠️ 待替换    现在用的是示例值，需要换成查证过的
#   ✅ 已确认    已查证，可写进报告
#
# 注意：下面四个值目前都取自示例代码，是为了让流水线先跑通而填的
# 占位值，不是查来的。四个都还没落实来源。
# ---------------------------------------------------------------------------

[wacc]
risk_free            = 0.0235    # 中国 10 年期国债到期收益率 | 待填基准日 | ⚠️ 待替换（当前是示例值）
beta                 = 1.20      # 待填：对哪个指数 / 什么频率 / 多长窗口 / 数据来源 | ⚠️ 待查（当前是示例值）
equity_risk_premium  = 0.065     # 待填：引用哪份研究、哪一年的版本 | ⚠️ 待查（当前是示例值）
cost_of_debt         = 0.035     # 将来改为 利息支出 / 平均有息负债（取自年报附注）| ⚠️ 待替换


# ---------------------------------------------------------------------------
# 二之三、终值假设
#
# 显式预测期结束之后，公司还值多少（终值）。两种算法选一种：
#   perpetuity      永续增长法：终值 = 末年 FCFF × (1 + g) / (WACC − g)
#   exit_multiple   退出倍数法：终值 = 末年 EBITDA × 退出倍数
#
# 约束：永续增长率必须低于无风险利率、低于长期名义 GDP、且低于 WACC。
#
# 字段名与估值模块的 ForecastAssumptions 一致，方便直接对应。
# ---------------------------------------------------------------------------

[terminal]
terminal_method = "perpetuity"   # perpetuity 或 exit_multiple
terminal_growth = 0.025          # 永续增长率，method = perpetuity 时使用
# exit_multiple = 8.0            # 退出倍数，method = exit_multiple 时打开

# 折现是否用「中值惯例」：假设现金流在年中发生，折现期数减 0.5。
# false 是更保守的算法；true 更贴近现实。两种都是通行做法，报告里要说明选了哪种。
mid_year        = false


# ---------------------------------------------------------------------------
# 二之四、敏感性分析：考察哪些假设、各浮动多少
#
# 为什么变量表要放在这里而不是写死在代码里：
#   写死在代码里，「敏感性分析」就变成了「演示几个我挑好的参数」。
#   放在配置里，换了公司、换了假设，变量表跟着一起改。
#
# 每个变量只写「名字 + 字段 + 浮动量」，**基准值不用写** —— 它有唯一来源：
#     field = "wacc"            基准 = 这次运行算出来的 WACC
#     逐年字段（如收入增速）      基准 = 各年的平均值
#     其余标量字段               基准 = 该字段的值
# 这样就不会出现「配置里写 20%、假设里算出来 25%」这种自相矛盾。
#
# 字段名必须是估值模块 ForecastAssumptions 上的字段，或者是 "wacc"。
# 可用的字段：revenue_base, revenue_growth, ebit_margin, tax_rate,
#             da_pct_revenue, capex_pct_revenue, nwc_pct_revenue,
#             terminal_method, terminal_growth, exit_multiple, mid_year
#
# ⚠️ 注意「逐年字段」的语义：浮到某个值时，会把**每一年**都设成那个值，
# 也就是问「如果未来每年增速都是 X，估值是多少」，而不是只改第一年。
# 这是估值引擎的广播语义，报告里要写明，否则「收入增速 ±3pp」会产生歧义。
#
# 为什么浮动幅度也算「假设」、也要写在配置里：
#   龙卷风图的排序不只取决于模型，也取决于你给每个参数定了多宽的上下界。
#   把 A 的幅度放宽一倍，A 就会爬到榜首。所以幅度本身是一个判断，
#   报告里要能解释「为什么永续增长率取 ±1 个百分点而不是 ±0.5」。
#   每个 delta 后面的注释就是那个解释。
#
#   每条注释分两段写：
#     形态覆盖 —— 这个幅度对应什么经营情形（从哪一种到哪一种）
#     后果核对 —— 它让每股价值动多少、在六项里排第几
#   ⚠️ 后果核对里的数字取自最近一次运行（make run）的产物，
#      换输入之后要重跑再更新，否则那几行会变成过期数字。
#
# grid_row / grid_col 是双因素网格用的两个变量，按上面的 name 引用。
# ---------------------------------------------------------------------------

[sensitivity]
grid_row    = "永续增长率"    # 网格的纵轴
grid_col    = "WACC"         # 网格的横轴
grid_points = 5              # 每个轴取几个点

[[sensitivity.variables]]
name  = "EBIT 利润率"
field = "ebit_margin"
# ±3pp 的依据：
#   形态覆盖 —— EBIT 利润率 20% 由「毛利率 40% − 费用率 15% − 折旧 5%」得来；
#     ±3pp 相当于毛利率或费用率单独让一步（毛利率 37%~43%，或费用率 12%~18%），
#     对应「竞争加剧、成本上行」到「提价顺利、费用被规模摊薄」两种情形。
#   后果核对 —— 每股价值 7.63 ~ 10.98 元，波动 3.36 元（占区间宽度 22.6%，
#     六项中最大）。解释力最强，所以也正是必须讲清楚依据的那一项。
delta = 0.03

[[sensitivity.variables]]
name  = "WACC"
field = "wacc"
# ±1pp 的依据：
#   形态覆盖 —— 9.47% 的 ±1pp 是相对 10.6% 的幅度，并不小：折成参数约等于
#     beta ±0.17（1.20 ± 0.17），或股权风险溢价 ±0.9pp。也就是说
#     「换一个指数、换一段窗口算 beta」或「换一版风险溢价研究」就落在区间内。
#   后果核对 —— 每股价值 10.98 ~ 8.05 元，波动 2.94 元（占区间宽度 19.8%，
#     第三）。折现率动 1 个百分点就有约三成的股价摆幅，
#     所以 WACC 每一项参数的来源都要写清楚。
delta = 0.01

[[sensitivity.variables]]
name  = "收入增速"
field = "revenue_growth"
# ±3pp 的依据：
#   形态覆盖 —— 基准 8%（五年 10%/9%/8%/7%/6% 的平均），±3pp 让区间落到 5%~11%：
#     下界是「行业进入低增速、份额守不住」，上界是「重回双位数增长」。
#     这正是管理层指引与券商预测之间常见的分歧宽度。
#   后果核对 —— 每股价值 8.25 ~ 10.06 元，波动 1.81 元（占区间宽度 12.2%，
#     第五）。增速的影响没有直觉上那么大：收入涨得快，营运资本与资本开支
#     要跟着垫，FCFF 被抵掉一部分。
delta = 0.03

[[sensitivity.variables]]
name  = "永续增长率"
field = "terminal_growth"
# ±1pp 的依据：
#   形态覆盖 —— 基准 2.5%，±1pp 落到 1.5%~3.5%：1.5% 是「低通胀、成熟期」，
#     3.5% 是「永远跑赢成熟经济体」。
#   ⚠️ 边界提醒 —— 本文件开头的约定是「永续增长率应低于无风险利率」，当前
#     无风险利率 2.35%，而基准值 2.5% 已经高出 0.15pp，上界 3.5% 越界更多。
#     代码只强制 g < WACC（algorithm/finai/dcf.py），不强制 g < rf，所以不会
#     报错。换真实数据时要么把 g 压到无风险利率以下，要么把这条约定改成
#     「允许略高于 rf，但必须解释」。
#   后果核对 —— 每股价值 8.33 ~ 10.60 元，波动 2.26 元（占区间宽度 15.3%，
#     第四）。终值占企业价值约 74%，所以它比收入增速更值得解释。
delta = 0.01

[[sensitivity.variables]]
name  = "资本开支占比"
field = "capex_pct_revenue"
# ±2pp 的依据（判断型，不是引用 —— 年报里没有「资本开支占比该是多少」这句话，
# 它是从「维持性开支」与「扩张性开支」的形态差别推出来的）：
#   基准情形是资本开支 6% / 折旧 5%，两者接近，属于「略高于维持、温和扩张」。
#   ±2pp 让它落在 4%（低于折旧，等于吃老本、收缩）与 8%（明显扩张）两端，
#   正好把「收缩 / 维持 / 扩张」三种形态都覆盖到。
#   后果核对 —— 这个幅度对应每股价值 7.81 ~ 10.80 元，
#   波动 2.98 元，占整个估值区间宽度的 20%，与 EBIT 利润率（3.36）、
#   WACC（2.94）同量级 —— 既没有把次要变量做成主导，也没小到看不出影响。
# 将来抽取层拿到真实历史数据后，可升级成量化依据（例如「过去五年资本开支
# 占收入比落在 4%~8%」，把它变成引用而不是判断）。
delta = 0.02

[[sensitivity.variables]]
name  = "税率"
field = "tax_rate"
# ±5pp 的依据：
#   形态覆盖 —— 基准 25% 是中国企业所得税法定税率，±5pp 落到 20%~30%：
#     下界覆盖「部分业务享受优惠」，上界覆盖「纳税调整偏保守」。
#     没有直接跳到 15%（高新技术企业优惠）：那要经过资格认定，
#     属于另一个情景，不属于敏感性分析的浮动范围。
#   后果核对 —— 每股价值 10.05 ~ 8.56 元，波动 1.49 元（占区间宽度 10.1%，
#     六项中最小）。
delta = 0.05



# ---------------------------------------------------------------------------
# 二之五、反向求解：反解哪些参数
#
# 反向求解问的是「当前股价隐含了什么样的假设」—— 让每股价值等于现价，
# 反推各参数该是多少，再和公司历史对照。
#
# 每个参数只写「名字 + 字段」，**搜索区间不用写** —— 直接用算法模块给的
# DEFAULT_BOUNDS，不另设一套。反解区间如果和模块默认值不一致，
# 同一个问题会有两个答案。
#
# 可反解的字段（即 DEFAULT_BOUNDS 里的那些）：
#     wacc, terminal_growth, revenue_growth, ebit_margin, tax_rate,
#     da_pct_revenue, capex_pct_revenue, nwc_pct_revenue, exit_multiple
#
# 基准值的取法与敏感性一致（逐年字段取各年平均值），实现见 adapters.py。
# ---------------------------------------------------------------------------

[[reverse.variables]]
name  = "永续增长率"
field = "terminal_growth"

[[reverse.variables]]
name  = "WACC"
field = "wacc"

[[reverse.variables]]
name  = "收入增速"
field = "revenue_growth"

[[reverse.variables]]
name  = "EBIT 利润率"
field = "ebit_margin"


# ---------------------------------------------------------------------------
# 二之六、相对估值：用哪些倍数
#
# 可用的倍数：
#     pe, pb, ps          权益类 —— 倍数 x 目标公司每股指标，直接得到隐含股价
#     ev_ebitda, ev_ebit  企业价值类 —— 倍数 x 目标公司指标得到隐含企业价值，
#                         再减净债务、少数股东权益，加回非经营性资产，除以股数
#
# 建议两类都用：口径不同，结论不一致是正常的（报告里要解释为什么）。
# 只用一类容易被质疑「挑了对结论有利的那种」。
#
# 这个清单还会影响足球场图 —— 每个倍数画一条横条，配了这里就自动跟着变。
# 异常值剔除默认关闭（可比公司通常只有三五家，按四分位距自动剔除会显著
# 改变结论），需要时在算法层显式打开。
# ---------------------------------------------------------------------------

[comps]
multiples = ["pe", "pb", "ev_ebitda"]





# ---------------------------------------------------------------------------
# 三、基期资产负债表（对应 BalanceSheetState）
#
# 这是预测的起点。三个恒等式必须成立，否则 build_forecast 会直接报错：
#     资产总计 = 负债合计 + 权益合计
#     资产总计 = cash + accounts_receivable + inventory
#               + fixed_assets + other_non_current_assets
#     负债合计 = accounts_payable + interest_bearing_debt
#               + other_non_current_liabilities
#     权益合计 = share_capital + retained_earnings + minority_equity
#
# 本例验算：
#     资产 = 55 + 60 + 40 + 200 + 30 = 385
#     负债 = 40 + 100 + 25          = 165
#     权益 = 100 + 120              = 220
#     165 + 220 = 385  ✓
# ---------------------------------------------------------------------------

[opening_balance]
cash                        = 55.0    # 货币资金
accounts_receivable         = 60.0    # 应收账款
inventory                   = 40.0    # 存货
fixed_assets                = 200.0   # 固定资产
other_non_current_assets    = 30.0    # 其他非流动资产
accounts_payable            = 40.0    # 应付账款
interest_bearing_debt       = 100.0   # 有息负债
other_non_current_liabilities = 25.0  # 其他非流动负债
share_capital               = 100.0   # 股本
retained_earnings           = 120.0   # 留存收益（未分配利润）
minority_equity             = 0.0     # 少数股东权益
